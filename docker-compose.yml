services:
  app:
    build: .
    container_name: deportivo-app
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:Z
    environment:
      - DB_HOST=db
      - TZ=Europe/Madrid
    networks:
      - deportivo-network

  db:
    image: mariadb:10.11
    container_name: deportivo-db
    restart: always
    ports:
        - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: deportivo_db
      MYSQL_USER: grupo5
      MYSQL_PASSWORD: mi_password
    volumes:
      - ./data:/var/lib/mysql:Z
    networks:
      - deportivo-network

networks:
  deportivo-network:
    driver: bridge
